name: mdcheck Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Build
      run: go build -o mdcheck .

    - name: Run unit tests
      run: go test -v ./...

    - name: Integration tests
      run: |
        echo "=== passing.md ==="
        ./mdcheck test_data/passing.md && echo "✓ exit 0"

        for f in test_data/fail_*.md; do
          echo "=== $f ==="
          if ./mdcheck "$f"; then
            echo "✗ expected non-zero exit"
            exit 1
          fi
          echo "✓ exit 1 (expected)"
        done
